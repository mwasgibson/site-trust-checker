<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Site Trust Checker</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    #url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
    }
    #score-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    #score {
      font-size: 32px;
      font-weight: 700;
    }
    #verdict {
      font-size: 13px;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }
    #reasons {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
    }
    #reasons li {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .sev-high { color: #c0392b; }
    .sev-medium { color: #d68910; }
    .sev-low { color: #7f8c8d; }
    #status {
      font-size: 12px;
      color: #666;
    }
    #rescan {
      margin-top: 12px;
      width: 100%;
      padding: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Site Trust Checker</h1>
  <div id="url">Loading current tab...</div>
  <div id="status">Analyzing...</div>
  <div id="score-container" style="display:none;">
    <div id="score"></div>
    <div id="verdict"></div>
  </div>
  <ul id="reasons"></ul>
  <button id="rescan">Re-scan this site</button>
  <div id="user-id-row" style="margin-top:10px; font-size:10px; color:#999;"></div>
  <script src="popup.js"></script>
</body>
</html>
